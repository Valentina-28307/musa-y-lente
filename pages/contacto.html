    <main>
       <section class="contacto">

        <h2 class="titulos2">Contacto</h2>

        <p class="parrafo">
        ¿Tienes una idea para una sesión o evento?
        Cuéntanos y hagamos que tus momentos se conviertan
        en recuerdos que permanezcan.
        </p>

    </section>



    <section class="contactanos">

        <h2 class="titulos2">Escríbenos</h2>

        <form class="formulario">

            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" placeholder="Escriba su nombre">


            <label for="correo">Correo</label>
            <input type="email" id="correo" placeholder="Escriba su correo">


            <label for="telefono">Teléfono</label>
            <input type="text" id="telefono" placeholder="Escriba su teléfono">


            <label for="servicio">Servicio</label>
            <input type="text" id="servicio" placeholder="Escriba el tipo de sesión que desea">


            <label for="mensaje">Mensaje</label>
            <textarea id="mensaje" placeholder="Cuéntenos sobre tu idea"></textarea>


            <input type="submit" id="enviar" value="Enviar">

        </form>


    </section>
